server {
  listen 80;
  root /usr/share/nginx/html;
  # La API de Directus, en el mismo origen que la app: la cookie de sesión es de primera parte.
  # El nombre «directus» se resuelve en cada petición (DNS interno de Docker): nginx arranca aunque Directus aún no esté.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $directus http://directus:8055;
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $directus;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
  }
  # Aplicación de una sola página: toda ruta (/perfil, /sesion…) carga index.html.
  location / {
    try_files $uri /index.html;
  }
  location ~* \.(js|css|png|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
