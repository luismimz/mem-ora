server {
  listen 80;
  root /usr/share/nginx/html;
  # La API de Directus, en el mismo origen que la app: la cookie de sesión es de primera parte.
  # El nombre «directus» se resuelve en cada petición (DNS interno de Docker): nginx arranca aunque Directus aún no esté.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $directus http://directus:8055;
  location /api/ {
    # Fallo de Node de oct. 2026 (CVE-2026-111497, descompresor Brotli): la app nunca envía cuerpos comprimidos, así
    # que se rechaza cualquier petición con Content-Encoding antes de que llegue a Directus.
    if ($http_content_encoding != "") { return 415; }
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $directus;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
  }
  # Aplicación de una sola página: toda ruta (/perfil, /sesion…) carga index.html.
  # D-074: la página y el service worker nunca se guardan en caché del navegador (si no, el móvil sigue con la
  # versión vieja). Los recursos con huella en el nombre (/assets/…) sí, un año.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
  location ~ ^/sw(-v\d+)?\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  # Voz Kokoro pregenerada (tools/audio/generate.py). Cada MP3 lleva en el nombre la huella de voz y texto: no cambia
  # nunca, así que se guarda un año. El índice sí cambia al añadir audios. Si falta un archivo, 404 (no la app).
  location /audio/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
    location ~ \.mp3$ {
      expires 365d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
  }
  location /assets/ {
    expires 365d;
    add_header Cache-Control "public, immutable";
  }
  location ~* \.(png|svg|woff2)$ {
    expires 7d;
  }
}
